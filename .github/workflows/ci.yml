name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  application:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the release image once
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t "geometrydash-ui-ci:$GITHUB_SHA" .
      - name: Validate host proxy and TLS configuration recovery
        run: python3 ops/ci/check-proxy.py "geometrydash-ui-ci:$GITHUB_SHA"
      - name: Scan the runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: geometrydash-ui-ci:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Start the exact candidate
        run: >-
          docker run -d --name geometrydash-ui-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m
          --cap-drop ALL --security-opt no-new-privileges:true
          -p 127.0.0.1:8080:8080 "geometrydash-ui-ci:$GITHUB_SHA"
      - name: Check HTTP, SPA routes, static assets and import worker
        run: python3 ops/smoke.py http://127.0.0.1:8080 "$GITHUB_SHA" --attempts 15
      - run: npx playwright install --with-deps chromium
      - name: Test the container in Chromium
        run: npx playwright test --config=playwright.ci.config.ts
      - name: Export the tested image for this release run
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts
          docker save "geometrydash-ui-ci:$GITHUB_SHA" | gzip > artifacts/image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: tested-production-image
          path: artifacts/image.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Container diagnostics
        if: always()
        run: docker logs geometrydash-ui-ci 2>&1 || true
  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: bash ops/ci/terraform-check.sh
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Lint shell scripts
        run: shellcheck ops/remote.sh ops/ci/*.sh ops/host/startup.sh.tftpl
      - name: Scan Terraform security configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          skip-dirs: '**/.terraform'
          exit-code: '1'
      - name: Scan source for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scanners: secret
          scan-ref: .
          skip-dirs: .git,infra/bootstrap/.terraform,infra/production/.terraform,infra/github/.terraform
          exit-code: '1'
  release-logic:
    name: Release logic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s ops/tests -v
      - run: python3 -m compileall -q ops

# FUTURE DEV/STAGING: add jobs only after independent infrastructure and identity
# boundaries exist. No nonproduction deploy or cloud credentials in PR checks.
