name: Production release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geometrydash-ui-production-mutations
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_GCP_DEPLOYMENTS == 'true'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash ops/ci/check-production-vars.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-production-image
          path: artifacts
      - run: docker load -i artifacts/image.tar.gz
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PUBLISHER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Publish the tested image; record its immutable registry digest
        id: image
        run: |
          registry="$GCP_REGION-docker.pkg.dev"
          repository="$registry/$GCP_PROJECT_ID/geometrydash-ui-production/web"
          tag="$repository:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gcloud auth configure-docker "$registry" --quiet
          docker tag "geometrydash-ui-ci:$GITHUB_SHA" "$tag"
          docker push "$tag"
          digest="$(gcloud artifacts docker images describe "$tag" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s@%s\n' "$repository" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Tested commit: %s\n\nImage: %s@%s\n' "$GITHUB_SHA" "$repository" "$digest" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      PROD_VM: ${{ vars.PROD_VM }}
      PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
      RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash ops/ci/check-production-vars.sh
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy and validate from outside GCP
        run: |
          bash ops/remote.sh deploy "$RELEASE_IMAGE" "$GITHUB_SHA"
          if ! python3 ops/smoke.py "https://$PROD_DOMAIN" "$GITHUB_SHA" --attempts 3; then
            echo 'External verification failed; attempting rollback.' >&2
            bash ops/remote.sh rollback
            exit 1
          fi
      - name: Record current and previous release for recovery
        if: always()
        run: |
          mkdir -p artifacts
          bash ops/remote.sh status > artifacts/release.json
          cat artifacts/release.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-release-record
          path: artifacts/release.json
          retention-days: 90
          if-no-files-found: error

