name: Production rollback
on:
  workflow_dispatch:
    inputs:
      recovery_digest:
        description: 'Leave blank for previous release; disaster recovery only: sha256 digest from a successful release record'
        required: false
        type: string
      recovery_revision:
        description: 'For disaster recovery only: matching full commit SHA from the same release record'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: geometrydash-ui-production-mutations
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_GCP_DEPLOYMENTS == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      PROD_VM: ${{ vars.PROD_VM }}
      PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
      RECOVERY_DIGEST: ${{ inputs.recovery_digest }}
      RECOVERY_REVISION: ${{ inputs.recovery_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash ops/ci/check-production-vars.sh
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Restore an existing tested release without rebuilding
        run: |
          if [[ -n "$RECOVERY_DIGEST" ]]; then
            [[ "$RECOVERY_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
            [[ "$RECOVERY_REVISION" =~ ^[a-f0-9]{40}$ ]]
            image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/geometrydash-ui-production/web@$RECOVERY_DIGEST"
            bash ops/remote.sh deploy "$image" "$RECOVERY_REVISION"
          else
            [[ -z "$RECOVERY_REVISION" ]]
            bash ops/remote.sh rollback
          fi
      - name: Record and verify the restored release
        run: |
          mkdir -p artifacts
          bash ops/remote.sh status > artifacts/release.json
          revision="$(python3 -c 'import json; print(json.load(open("artifacts/release.json"))["current"]["revision"])')"
          python3 ops/smoke.py "https://$PROD_DOMAIN" "$revision"
          cat artifacts/release.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-rollback-record
          path: artifacts/release.json
          retention-days: 90
